portability_reason = "The reference is PyBaMM's own output (gt_type high-fidelity-solver): a single-particle-with-electrolyte model with a lumped thermal model, searched for the CC current at which the peak volume-averaged temperature touches 318.15 K. Another electrochemical code solves the same model class, but the limit current is a threshold crossing that amplifies small differences in heat-source terms, thermal closure and the SPMe variant, so it must be calibrated before its scores are trusted."
